<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增 / 编辑菜谱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-amber-50/40 text-slate-800">
  <div class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-4">
      <a href="/" class="text-sm text-slate-500 hover:text-amber-700">← 返回列表</a>
    </div>

    <h1 id="page-title" class="mb-1 text-2xl font-bold">新增菜谱</h1>
    <p id="breadcrumb" class="mb-4 text-sm text-slate-500"></p>

    <div id="message" class="hidden"></div>

    <form id="recipe-form" class="space-y-5 rounded-xl border border-amber-200 bg-white p-6 shadow-sm">
      <div>
        <label for="title-input" class="mb-1 block text-sm font-medium text-slate-600">标题</label>
        <input id="title-input" name="title" type="text" required maxlength="120"
               placeholder="例如：冰糖糖浆"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-amber-500 focus:outline-none">
        <p class="mt-1 text-xs text-slate-400">标题将作为文件名（/ \ : * ? " &lt; &gt; | 等字符会被替换为全角）。</p>
      </div>

      <div>
        <div class="mb-2 text-sm font-medium text-slate-600">标签</div>
        <div id="tag-pickers" class="space-y-3"></div>
      </div>

      <div>
        <label for="content-input" class="mb-1 block text-sm font-medium text-slate-600">正文（Markdown）</label>
        <textarea id="content-input" name="content" rows="16"
                  placeholder="## 原材料&#10;- 冰糖 100g&#10;&#10;## 步骤&#10;1. 锅中加入冰糖和水"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono text-sm focus:border-amber-500 focus:outline-none"></textarea>
      </div>

      <div class="flex items-center gap-3">
        <button id="submit-btn" type="submit"
                class="rounded-lg bg-amber-600 px-5 py-2 text-white hover:bg-amber-700 disabled:opacity-50">保存</button>
        <a href="/" class="text-sm text-slate-500 hover:text-amber-700">取消</a>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
  <script>initFormPage();</script>
</body>
</html>
