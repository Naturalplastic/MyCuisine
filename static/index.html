<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的菜谱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-amber-50/40 text-slate-800">
  <div class="mx-auto max-w-5xl px-4 py-8">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-2xl font-bold">🍳 我的菜谱</h1>
      <a href="/form.html" class="rounded-lg bg-amber-600 px-4 py-2 text-sm text-white hover:bg-amber-700">+ 新增菜谱</a>
    </header>

    <section class="mb-6 rounded-xl border border-amber-200 bg-white p-4 shadow-sm">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
        <h2 class="font-semibold text-slate-700">按标签筛选</h2>
        <div class="flex gap-2">
          <button id="clear-filters" type="button" class="rounded-lg border border-slate-300 px-3 py-1 text-sm hover:bg-slate-50">清除筛选</button>
          <button id="apply-filters" type="button" class="rounded-lg bg-slate-800 px-3 py-1 text-sm text-white hover:bg-slate-700">应用筛选</button>
        </div>
      </div>
      <div id="filters" class="space-y-3"></div>
      <p class="mt-3 text-xs text-slate-500">不同类别之间是「且」（需同时满足），同一类别内多选是「或」。</p>
    </section>

    <div id="message" class="hidden"></div>
    <p id="count" class="mb-3 text-sm text-slate-500"></p>
    <div id="list" class="grid gap-4 sm:grid-cols-2"></div>
  </div>

  <script src="/app.js"></script>
  <script>initListPage();</script>
</body>
</html>
